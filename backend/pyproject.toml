[project]
name = "devtwin-backend"
version = "1.0.0"
requires-python = ">=3.12"
# google-genai is installed separately to avoid uv lock resolver conflicts
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "pydantic==2.7.1",
    "httpx==0.27.0",
    "python-dotenv>=1.0.0",
    "python-multipart==0.0.9",
    "aiofiles==23.2.1",
]

[tool.uv]
# Tell uv not to resolve/lock — use pip install directly
managed = false
